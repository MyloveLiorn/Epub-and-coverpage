name: Search states

# On demand: search every state's own websites (or the states chosen) for one topic of
# automation/govbooks.toml, all states at once, and keep each state's best books: the longest
# documents of 18 pages or more on the topic that aren't paperwork. The results go to a
# "States - <topic>" tab of the Google Sheet and to the run's page; each topic has its own tab.
# It starts from the weekly run's database but doesn't change it.
on:
  # A push that changes automation/search-states.request also starts a search (of every state,
  # 5 books each) for the topic on its "topic:" line, on any branch: the Run workflow button works
  # only once this file is on the default branch.
  push:
    paths: [automation/search-states.request]
  workflow_dispatch:
    inputs:
      topic:
        description: 'Topic (a [topics.NAME] of automation/govbooks.toml), e.g. "immigration"'
        required: true
      states:
        description: 'States, e.g. "TX CA NY", or "all"'
        default: all
      top:
        description: Books kept per state
        default: "5"
      sites_per_state:
        description: Websites searched per state (and up to 20 agency sites under its portal)
        default: "30"

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      states: ${{ steps.states.outputs.states }}
      topic: ${{ steps.topic.outputs.topic }}
    steps:
      - uses: actions/checkout@v5

      - id: topic
        env:
          TOPIC: ${{ inputs.topic }}
        run: |
          topic="${TOPIC:-$(sed -n 's/^topic:[[:space:]]*//p' automation/search-states.request | tail -n 1)}"
          topic="$(printf '%s' "$topic" | tr -d '[:space:]')"
          if ! grep -qxF "[topics.$topic]" automation/govbooks.toml; then
            echo "No topic '$topic'. Topics: $(sed -n 's/^\[topics\.\(.*\)\]$/\1/p' automation/govbooks.toml | paste -sd' ')"
            exit 1
          fi
          echo "topic=$topic" >> "$GITHUB_OUTPUT"
          echo "Topic: $topic"

      - id: states
        env:
          STATES: ${{ inputs.states }}
        run: |
          all="AL AK AZ AR CA CO CT DE FL GA HI ID IL IN IA KS KY LA ME MD MA MI MN MS MO MT NE NV NH NJ NM NY NC ND OH OK OR PA RI SC SD TN TX UT VT VA WA WV WI WY"
          # States whose publications can't be reused are never searched.
          skip=" $(sed -e 's/#.*//' govweb/data/excluded_states.txt | tr '\n' ' ') "
          echo "Skipped (publications can't be reused): $skip"
          list="${STATES:-all}"
          [ "$list" = "all" ] && list="$all"
          json=$(for st in $list; do st="${st^^}"; [[ " $all " == *" $st "* && "$skip" != *" $st "* ]] && echo "$st"; done \
            | jq -R . | jq -cs 'unique')
          [ "$json" != "[]" ] || { echo "No valid states in: $STATES"; exit 1; }
          echo "states=$json" >> "$GITHUB_OUTPUT"
          echo "States: $json"

  state:
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 75
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        state: ${{ fromJSON(needs.plan.outputs.states) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[covers]"

      - name: Start from the weekly run's database
        run: |
          mkdir -p data
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth=1 origin data
            git archive origin/data govweb.db.gz | tar -x -C data || true
            [ -e data/govweb.db.gz ] && gunzip -f data/govweb.db.gz
          fi
          ls -la data

      - name: Search ${{ matrix.state }}
        env:
          STATE: ${{ matrix.state }}
          TOPIC: ${{ needs.plan.outputs.topic }}
          TOP: ${{ inputs.top || '5' }}
          SITES_PER_STATE: ${{ inputs.sites_per_state || '30' }}
          KEEPA_API_KEY: ${{ secrets.KEEPA_API_KEY }}
          GOOGLE_BOOKS_API_KEY: ${{ secrets.GOOGLE_BOOKS_API_KEY }}
        run: automation/state-search.sh

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: state-${{ matrix.state }}
          path: results/
          if-no-files-found: ignore

  combine:
    needs: [plan, state]
    if: ${{ !cancelled() && needs.state.result != 'skipped' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install
        run: pip install ".[sheets]"

      - uses: actions/download-artifact@v4
        with:
          pattern: state-*
          path: results
          merge-multiple: true

      - name: Combine the states
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          # "Book Search Results" in the shared Drive folder; only people it is shared with can open it.
          GOOGLE_SHEET_ID: ${{ secrets.GOOGLE_SHEET_ID || '1gnjQu_hi_q-Y3gXBjmjdJerYwo9psUrGda3NQtCUtTA' }}
          TOPIC: ${{ needs.plan.outputs.topic }}
        run: |
          subject="$TOPIC"
          web=(govweb --db results/merge.db)
          shopt -s nullglob
          tops=(results/*-top.csv) sheets=(results/*-sheet.csv) alls=(results/*-all.csv)
          [ "${#tops[@]}" -gt 0 ] || { echo "No state finished."; exit 1; }
          # The latest published first (each state's best books were chosen by length).
          "${web[@]}" merge "${tops[@]}" --out results/states.md --rows 400 --sort-by year \
            --heading "The best books on $subject on each state's websites"
          "${web[@]}" merge "${tops[@]}" --out results/states.csv --sort-by year
          "${web[@]}" merge "${alls[@]}" --out results/states-all.csv --sort-by year
          "${web[@]}" merge "${sheets[@]}" --out results/states-sheet.csv --sort-by Year
          {
            echo "## States"
            echo
            cat results/*-summary.txt | sed 's/^/- /'
            echo
            cat results/states.md
          } > results/report.md
          cat results/report.md
          cat results/report.md >> "$GITHUB_STEP_SUMMARY"
          if [ -n "${GOOGLE_SERVICE_ACCOUNT_JSON:-}" ]; then
            "${web[@]}" sheet --formulas --tab "States - $subject=results/states-sheet.csv"
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: states-results
          path: |
            results/states*
            results/report.md
          if-no-files-found: ignore
