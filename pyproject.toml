[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "govbooks"
version = "0.1.0"
description = "Map US government agencies and .gov websites, find the books they publish on chosen topics, and check and track those books on Amazon."
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["requests>=2.31"]

[project.optional-dependencies]
dev = ["pytest>=8"]
sheets = ["google-auth>=2.20"]
covers = ["pypdfium2>=4"]  # tells whether a PDF opens with a cover

[project.scripts]
govbooks = "govbooks.cli:main"
govweb = "govweb.cli:main"

[tool.setuptools.packages.find]
include = ["govbooks*", "govweb*"]

[tool.setuptools.package-data]
govbooks = ["example.toml", "data/*.json"]
govweb = ["data/*.json", "data/*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
