# Settings for the weekly GitHub Actions run (.github/workflows/find-books.yml).
# Edit the [topics] section to change what is searched for: the crawls follow links about
# these topics first, and the results tables have a "topics" column.
# The websites searched in depth every week are listed in automation/priority-sites.txt.
# API keys are read from environment variables (GitHub secrets), never from this file:
#   KEEPA_API_KEY         for the "keepa" Amazon check with sales ranks (paid, https://keepa.com/#!api)
#   GOOGLE_BOOKS_API_KEY  optional: the free Amazon check then also looks in Google Books
#   AMAZON_CREATORS_CREDENTIAL_ID, AMAZON_CREATORS_CREDENTIAL_SECRET, AMAZON_PARTNER_TAG
#                         for the "creators" Amazon provider (Amazon Associates Creators API)

[amazon]
# "catalog" needs no keys but cannot see sales ranks; "keepa" or "creators" can.
provider = "catalog"
marketplace = "www.amazon.com"

# Topics. A document matches a topic when a keyword is in its title (score 3; a keyword only in
# the file name scores 1). A book is kept when its score reaches min_score. Any "exclude" hit
# drops the book.

[topics.beekeeping]
keywords = ["beekeeping", "honey bee", "apiculture", "beehive", "honey production"]
exclude = []
min_score = 3

[topics.food_preservation]
keywords = ["home canning", "food preservation", "canning", "pickling", "drying fruits", "curing meat"]
exclude = ["canning industry", "cannery workers"]
min_score = 3

[topics.survival]
keywords = ["survival", "wilderness survival", "evasion", "emergency preparedness", "first aid"]
exclude = ["survival rate", "survival analysis", "cancer survival"]
min_score = 3
