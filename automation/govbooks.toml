# Settings for the weekly GitHub Actions run (.github/workflows/find-books.yml).
# Edit the [topics] section to change what is searched for: the crawls follow links about
# these topics first, and the results tables have a "topics" column.
# The websites searched in depth every week are listed in automation/priority-sites.txt.
# API keys are read from environment variables (GitHub secrets), never from this file:
#   KEEPA_API_KEY         for the "keepa" Amazon check with sales ranks (paid, https://keepa.com/#!api)
#   GOOGLE_BOOKS_API_KEY  optional: the free Amazon check then also looks in Google Books
#   AMAZON_CREATORS_CREDENTIAL_ID, AMAZON_CREATORS_CREDENTIAL_SECRET, AMAZON_PARTNER_TAG
#                         for the "creators" Amazon provider (Amazon Associates Creators API)

[amazon]
# "catalog" needs no keys but cannot see sales ranks; "keepa" or "creators" can.
provider = "catalog"
marketplace = "www.amazon.com"

# Topics. A document matches a topic when a keyword is in its title (score 3; a keyword only in
# the file name scores 1). A book is kept when its score reaches min_score. Any "exclude" hit
# drops the book. Each topic is searched on its own: "Search states" searches one topic, and its
# prefer_sites (parts of site names) are the state websites searched first for it.

[topics.immigration]
keywords = ["immigration", "immigrant", "naturalization", "citizenship", "refugee", "asylum", "emigration",
            "Ellis Island", "Angel Island", "newcomer", "new immigrants", "new Americans"]
# "Asylum" also names 19th-century hospitals and orphanages, and "citizenship" school civics.
exclude = ["immigration court calendar", "hearing notice", "insane", "lunatic", "feeble-minded", "orphan asylum",
           "asylum for the deaf", "asylum for the blind", "digital citizenship", "corporate citizenship",
           "good citizenship", "citizenship award"]
min_score = 3
# Refugee and "new Americans" offices, and the human-services departments that run them.
prefer_sites = ["refugee", "immigra", "newamerican", "humanservice", "dhs", "dss", "dhhs"]

[topics.tenant-landlord]
keywords = ["tenant", "landlord", "renter", "eviction", "lease", "rental", "tenants' rights",
            "landlord-tenant", "tenant-landlord", "renters' rights", "housing rights",
            "security deposit", "fair housing", "habitability"]
exclude = ["hearing notice", "court calendar", "docket", "expenditure report", "CDBG-DR",
           "HAP contract", "housing assistance payment", "grant closeout"]
min_score = 3
# Housing agencies and housing finance agencies, consumer protection and the attorney general.
prefer_sites = ["housing", "hfa", "tenant", "landlord", "consumer", "attorneygeneral"]

[topics.law-enforcement-careers]
keywords = ["FBI careers", "CIA careers", "how to become an agent", "law enforcement careers",
            "careers in law enforcement", "police officer career", "become a police officer",
            "firefighter career", "become a firefighter", "fire service careers",
            "U.S. Marshals", "Secret Service careers", "DEA careers", "ATF careers",
            "Border Patrol careers", "CBP careers", "ICE careers", "TSA careers",
            "state trooper", "state police careers", "highway patrol careers",
            "career guide", "recruitment guide", "law enforcement training",
            "police academy", "fire academy", "criminal justice careers"]
exclude = ["most wanted", "press release", "news release", "crime statistics", "annual report",
           "budget request", "congressional testimony", "inspector general", "audit report",
           "court calendar", "hearing notice", "docket"]
min_score = 3
# Police, troopers and highway patrol, peace-officer standards and training (POST), fire marshals
# and fire academies, public safety, corrections, and the states' job sites.
prefer_sites = ["police", "trooper", "patrol", "post", "lawenforcement", "sheriff", "fire", "publicsafety",
                "dps", "corrections", "justice", "academy", "careers", "jobs"]
